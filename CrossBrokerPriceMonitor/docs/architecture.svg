<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Cross Broker Price Monitor architecture</title>
  <desc id="desc">Two MetaTrader 5 terminals send quote data through local TCP connections to a C sharp coordinator, which displays metrics and writes CSV logs.</desc>
  <defs>
    <style>
      .title{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#111827}
      .boxTitle{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#111827}
      .text{font:16px 'Segoe UI',Arial,sans-serif;fill:#374151}
      .small{font:14px 'Segoe UI',Arial,sans-serif;fill:#4b5563}
      .box{fill:#f9fafb;stroke:#374151;stroke-width:2;rx:18}
      .agent{fill:#eef6ff;stroke:#2563eb}
      .coord{fill:#ecfdf5;stroke:#059669}
      .output{fill:#fff7ed;stroke:#ea580c}
      .arrow{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Cross-Broker Price Monitor</text>

  <rect x="50" y="100" width="300" height="140" class="box agent"/>
  <text x="200" y="135" text-anchor="middle" class="boxTitle">MetaTrader 5 — Broker A</text>
  <text x="200" y="170" text-anchor="middle" class="text">CrossBrokerTickAgent.mq5</text>
  <text x="200" y="200" text-anchor="middle" class="small">Bid / Ask / heartbeat / local CSV</text>

  <rect x="50" y="300" width="300" height="140" class="box agent"/>
  <text x="200" y="335" text-anchor="middle" class="boxTitle">MetaTrader 5 — Broker B</text>
  <text x="200" y="370" text-anchor="middle" class="text">CrossBrokerTickAgent.mq5</text>
  <text x="200" y="400" text-anchor="middle" class="small">Bid / Ask / heartbeat / local CSV</text>

  <rect x="470" y="170" width="320" height="200" class="box coord"/>
  <text x="630" y="210" text-anchor="middle" class="boxTitle">C# Coordinator</text>
  <text x="630" y="245" text-anchor="middle" class="text">TCP listener: 127.0.0.1:19090</text>
  <text x="630" y="278" text-anchor="middle" class="small">HELLO · TICK · HEARTBEAT</text>
  <text x="630" y="310" text-anchor="middle" class="small">Freshness checks · edge calculations</text>
  <text x="630" y="342" text-anchor="middle" class="small">Demo mode · reconnect handling</text>

  <rect x="910" y="100" width="240" height="140" class="box output"/>
  <text x="1030" y="138" text-anchor="middle" class="boxTitle">Windows UI</text>
  <text x="1030" y="175" text-anchor="middle" class="text">Quotes and metrics</text>
  <text x="1030" y="205" text-anchor="middle" class="small">Warning / alert / stale status</text>

  <rect x="910" y="300" width="240" height="140" class="box output"/>
  <text x="1030" y="338" text-anchor="middle" class="boxTitle">CSV Logs</text>
  <text x="1030" y="375" text-anchor="middle" class="text">Raw quotes</text>
  <text x="1030" y="405" text-anchor="middle" class="small">Comparison snapshots</text>

  <path d="M350 170 C410 170 410 220 470 220" class="arrow"/>
  <path d="M350 370 C410 370 410 320 470 320" class="arrow"/>
  <path d="M790 220 C850 220 850 170 910 170" class="arrow"/>
  <path d="M790 320 C850 320 850 370 910 370" class="arrow"/>

  <text x="405" y="145" text-anchor="middle" class="small">Local TCP</text>
  <text x="405" y="395" text-anchor="middle" class="small">Local TCP</text>
  <text x="850" y="145" text-anchor="middle" class="small">Display</text>
  <text x="850" y="395" text-anchor="middle" class="small">Persist</text>
</svg>
